name: buzzerhood

services:
  # PostgreSQL Database
  postgres:
    image: postgres:17-alpine
    container_name: buzzerhood-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: buzzerhood
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - buzzerhood-network
      - carubra-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d buzzerhood"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /var/run/postgresql:size=16m,mode=0770
    mem_limit: 512m
    cpus: 1.0

  # Backend API
  api:
    build:
      context: ../../
      dockerfile: backend/Dockerfile
    image: buzzerhood-api:b4
    container_name: buzzerhood-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.api
    secrets:
      - source: jwt_private
        target: buzzerhood-jwt-private.pem
      - source: jwt_public
        target: buzzerhood-jwt-public.pem
    ports:
      - "127.0.0.1:3100:3100"
    networks:
      - buzzerhood-network
      - carubra-network
    user: "10001:10001"
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # Frontend Web
  web:
    build:
      context: ../../
      dockerfile: Dockerfile.web
    image: buzzerhood-web:b4
    container_name: buzzerhood-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    networks:
      - buzzerhood-network
      - carubra-network
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=32m,mode=1777
      - /var/run:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    mem_limit: 128m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  buzzerhood-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.32.0.0/24
  
  carubra-network:
    external: true

volumes:
  postgres_data:
    driver: local

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  jwt_private:
    file: ./secrets/jwt-private.pem
  jwt_public:
    file: ./secrets/jwt-public.pem
