name: buzzerhood-api
services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    image: buzzerhood-api:b3
    container_name: buzzerhood-api
    user: "1000:1000"
    init: true
    restart: unless-stopped
    env_file:
      - ../secrets/backend.env
    secrets:
      - source: jwt_private
        target: buzzerhood-jwt-private.pem
      - source: jwt_public
        target: buzzerhood-jwt-public.pem
    ports:
      - 127.0.0.1:3100:3100
    networks:
      - supabase
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: 1.0

networks:
  supabase:
    external: true
    name: supabase_default

secrets:
  jwt_private:
    file: ../secrets/jwt-private.pem
  jwt_public:
    file: ../secrets/jwt-public.pem
